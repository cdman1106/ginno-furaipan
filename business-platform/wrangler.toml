name = "instagram-feed-platform"
main = "worker.js"
compatibility_date = "2026-09-16"

[vars]
# Set after deploy, for example:
# BASE_URL = "https://instagram-feed-platform.your-subdomain.workers.dev"

[[kv_namespaces]]
binding = "PLATFORM"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[triggers]
crons = ["*/10 * * * *"]

# Required secrets/variables in Cloudflare Dashboard:
# ADMIN_PASSWORD          -> Secret
# SESSION_SECRET          -> Secret (random 32+ chars)
# TOKEN_ENCRYPTION_KEY    -> Secret (random 32+ chars)
# IG_APP_ID               -> Text
# IG_APP_SECRET           -> Secret
# BASE_URL                -> Text
