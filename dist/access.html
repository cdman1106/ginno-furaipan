<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>洋食や 銀のフライパン｜非公開中</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f5f1e8;color:#2b2823}
    body{min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding:28px}
    main{width:min(620px,100%);text-align:center;padding:56px 28px;border:1px solid rgba(43,40,35,.18);background:rgba(255,255,255,.62);box-shadow:0 18px 60px rgba(43,40,35,.08)}
    .en{font-family:Georgia,"Times New Roman",serif;letter-spacing:.28em;font-size:12px;margin:0 0 18px;color:#88775b}
    h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(30px,7vw,48px);font-weight:500;letter-spacing:.08em;margin:0 0 24px}
    .line{width:42px;height:1px;background:#a68b61;margin:0 auto 24px}
    p{font-size:15px;line-height:2;margin:0;color:#5d574d}
    small{display:block;margin-top:34px;color:#9a9287;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <p class="en">GIN NO FURAIPAN</p>
    <h1>非公開中</h1>
    <div class="line"></div>
    <p>ただいまホームページを一時的に非公開にしております。</p>
    <small>洋食や 銀のフライパン</small>
  </main>
</body>
</html>
